app:
  name: firesight-shadow-p50
  data_root: data
  models_dir: models
  artifacts_dir: artifacts
  log_level: INFO

server:
  host: 0.0.0.0
  port: 8000
  cors_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
  max_upload_mb: 512

# SHADOW-ONLY release candidate. Do not enable autonomous dispatch/siren.
detector:
  model_path: build/kaggle_weights/runs/P50/weights/best.onnx
  backend: onnx
  imgsz: 640
  iou: 0.45
  max_det: 100
  device: auto
  class_map:
    0: fire
    1: smoke
  conf:
    fire: 0.29
    smoke: 0.33

temporal:
  enabled: true
  n_of_m:
    fire: [3, 5]
    smoke: [4, 6]
  max_gap_s: 2.0
  min_area_px: 400
  smoke_growth_window: 8
  smoke_growth_min_ratio: 0.15
  unknown_high_conf: 0.60
  unknown_auto_alarm_s: 60
  tracker: bytetrack
  track_iou: 0.3

verifier:
  enabled: false
  model_path: models/verifier.onnx
  threshold: 0.60
  classes: [fire, lookalike, smoke]

# Dashboard only: no webhook/siren until the pilot gates pass.
alarm:
  min_duration_s: 1.0
  cooldown_s: 30.0
  fire_type_include: [uncontrolled, unknown]
  fire_type_exclude: [controlled, spark_benign, screen]
  fire_type_warning: [electrical_arc]
  escalation:
    - level: 1
      after_s: 0
      action: dashboard

stream:
  sample_fps: 5.0
  reconnect_s: 3.0
  jpeg_quality: 80
  max_cameras: 9

benchmark:
  test_manifest: data/splits/test.jsonl
  val_manifest: data/splits/val.jsonl
  target_fpr: 0.02
